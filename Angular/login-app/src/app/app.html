<div class="container mt-5" *ngIf="!isLoggedIn">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white text-center">
          <h2 class="mb-0">Login</h2>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Username:</label>
            <input type="text" class="form-control" [(ngModel)]="username">
          </div>
          <div class="mb-3">
            <label class="form-label">Password:</label>
            <input type="password" class="form-control" [(ngModel)]="password">
          </div>
          <div class="d-grid gap-2">
            <button class="btn btn-primary" (click)="login()">Login</button>
          </div>
          <div class="mt-3 text-center text-danger fw-bold" *ngIf="message">
            {{message}}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-dashboard *ngIf="isLoggedIn" [username]="username" (logoutEvent)="logout()"></app-dashboard>
